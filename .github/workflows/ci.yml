name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Also builds dist/ through the "prepare" script
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Check the built package loads from CommonJS and ESM
        run: |
          node -e "const N = require('nexusse'); if (typeof N !== 'function' || N.Nexusse !== N) process.exit(1)"
          node --input-type=module -e "import N, { Nexusse } from 'nexusse'; if (N !== Nexusse) process.exit(1)"

      - run: npm pack --dry-run
